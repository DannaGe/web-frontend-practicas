<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        form {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"] {
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #e688ce;
            color: white;
        }

        button {
            padding: 5px 10px;
            background-color: rgb(161, 211, 231);
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(168, 188, 231);
        }

        #saveJsonButton {
            background-color: rgb(169, 126, 180);
            margin-top: 20px;
            cursor: pointer;
        }

        #saveJsonButton:hover {
            background-color: rgb(212, 146, 238);
        }

        #personTableBody {
            display: block;
            max-height: 150px;
            overflow-y: auto;
        }

        tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        thead,
        tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
    </style>
</head>

<body>
    <h2>Formulario de Registro de Personas</h2>

    <form id="personForm">
        <label for="clave">Clave:</label><br>
        <input type="text" id="clave" required><br>

        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" required><br>

        <label for="fechaNac">Fecha de Nacimiento:</label><br>
        <input type="date" id="fechaNac" required><br>

        <label for="edad">Edad:</label><br>
        <input type="number" id="edad" required><br>

        <button type="submit">Agregar Persona</button>
    </form>

    <h2>Personas Registradas</h2>

    <table>
        <thead>
            <tr>
                <th>Clave</th>
                <th>Nombre</th>
                <th>Fecha de Nacimiento</th>
                <th>Edad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="personTableBody"></tbody>
    </table>

    <button id="saveJsonButton">Guardar en JSON</button>
    <input type="file" id="jsonFileInput" accept=".json">
    <button id="loadJsonButton">Cargar desde JSON</button>

    <script>
        let personas = [];
        const form = document.getElementById('personForm');
        const claveInput = document.getElementById('clave');
        const nombreInput = document.getElementById('nombre');
        const fechaNacInput = document.getElementById('fechaNac');
        const edadInput = document.getElementById('edad');
        const tableBody = document.getElementById('personTableBody');
        const saveJsonButton = document.getElementById('saveJsonButton');
        const loadJsonButton = document.getElementById('loadJsonButton');
        const jsonFileInput = document.getElementById('jsonFileInput');
        let indiceEnEdicion = null;

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            if (indiceEnEdicion !== null) {
                personas[indiceEnEdicion] = {
                    clave: claveInput.value,
                    nombre: nombreInput.value,
                    fechaNac: fechaNacInput.value,
                    edad: edadInput.value
                };
                indiceEnEdicion = null;
                form.querySelector('button[type="submit"]').textContent = 'Agregar Persona';
            } else {
                const persona = {
                    clave: claveInput.value,
                    nombre: nombreInput.value,
                    fechaNac: fechaNacInput.value,
                    edad: edadInput.value
                };
                personas.push(persona);
            }

            form.reset();
            actualizarTabla();
        });

        function actualizarTabla() {
            tableBody.innerHTML = '';

            personas.forEach(function (persona, index) {
                const row = document.createElement('tr');

                const claveCell = document.createElement('td');
                claveCell.textContent = persona.clave;

                const nombreCell = document.createElement('td');
                nombreCell.textContent = persona.nombre;

                const fechaNacCell = document.createElement('td');
                fechaNacCell.textContent = persona.fechaNac;

                const edadCell = document.createElement('td');
                edadCell.textContent = persona.edad;

                const accionesCell = document.createElement('td');
                const eliminarButton = document.createElement('button');
                eliminarButton.textContent = 'Eliminar';
                eliminarButton.addEventListener('click', function () {
                    eliminarPersona(index);
                });

                const modificarButton = document.createElement('button');
                modificarButton.textContent = 'Modificar';
                modificarButton.addEventListener('click', function () {
                    cargarDatosParaModificar(persona, index);
                });

                accionesCell.appendChild(eliminarButton);
                accionesCell.appendChild(modificarButton);

                row.appendChild(claveCell);
                row.appendChild(nombreCell);
                row.appendChild(fechaNacCell);
                row.appendChild(edadCell);
                row.appendChild(accionesCell);

                tableBody.appendChild(row);
            });
        }

        function cargarDatosParaModificar(persona, index) {
            claveInput.value = persona.clave;
            nombreInput.value = persona.nombre;
            fechaNacInput.value = persona.fechaNac;
            edadInput.value = persona.edad;

            indiceEnEdicion = index;
            form.querySelector('button[type="submit"]').textContent = 'Guardar Cambios';
        }

        function eliminarPersona(index) {
            personas.splice(index, 1);
            actualizarTabla();
        }

        saveJsonButton.addEventListener('click', function () {
            const jsonData = JSON.stringify(personas, null, 2);
            const blob = new Blob([jsonData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'personas.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        loadJsonButton.addEventListener('click', function () {
            const file = jsonFileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const jsonData = JSON.parse(e.target.result);
                        personas = jsonData;
                        actualizarTabla();
                    } catch (error) {
                        alert("Error al leer el archivo JSON");
                    }
                };
                reader.readAsText(file);
            } else {
                alert("Por favor selecciona un archivo JSON.");
            }
        });
    </script>
</body>

</html>
