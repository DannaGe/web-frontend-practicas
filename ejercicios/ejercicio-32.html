<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas</title>
    <style>
        /* Estilos básicos para el cuerpo de la página */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* Estilos para el formulario */
        form {
            margin-bottom: 20px;
        }

        /* Estilos para los campos de entrada */
        input[type="text"], input[type="date"], input[type="number"] {
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
        }

        /* Estilos para la tabla */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Estilos para las celdas de la tabla */
        table, th, td {
            border: 1px solid rgb(122, 36, 118);
        }

        /* Estilos para las celdas de encabezado */
        th, td {
            padding: 8px;
            text-align: left;
        }

        /* Color de fondo para el encabezado de la tabla */
        th {
            background-color: #a06097;
            color: white;
        }

        /* Estilos para los botones generales */
        button {
            padding: 5px 10px;
            border: none;
            cursor: pointer;
            color: rgb(148, 103, 165);
        }

        /* Estilos para los botones de guardar y cargar CSV */
        #saveCsvButton, #loadCsvButton {
            background-color: rgb(243, 95, 206);
            margin-top: 20px;
        }

        #saveCsvButton:hover, #loadCsvButton:hover {
            background-color: rgb(226, 50, 197);
        }

        /* Estilos para limitar la altura del cuerpo de la tabla */
        #personTableBody {
            display: block;
            max-height: 150px;
            overflow-y: auto;
        }

        /* Estilo para que las celdas mantengan alineación al usar scroll */
        #personTableBody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        thead, tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
    </style>
</head>

<body>

    <h2>Formulario de Registro de Personas</h2>
	<form id="personForm">
		<label for="clave">Clave:</label><br>
		<input type="text" id="clave" required><br>
		<label for="nombre">Nombre:</label><br>
		<input type="text" id="nombre" required><br>
		<label for="fechaNac">Fecha de Nacimiento:</label><br>
		<input type="date" id="fechaNac" required><br>
		<label for="edad">Edad:</label><br>
		<input type="number" id="edad" required><br>
		<button type="submit">Agregar Persona</button>
	</form>

	<h2>Personas Registradas</h2>
	<table>
		<thead>
			<tr>
				<th>Clave</th>
				<th>Nombre</th>
				<th>Fecha de Nacimiento</th>
				<th>Edad</th>
				<th>Acciones</th>
			</tr>
		</thead>
		<tbody id="personTableBody"></tbody>
	</table>

	<button id="saveCsvButton">Guardar en CSV</button>
	<input type="file" id="csvFileInput" accept=".csv">
	<button id="loadCsvButton">Cargar desde CSV</button>

	<script>
		let personas = [];
		const form = document.getElementById('personForm');
		const claveInput = document.getElementById('clave');
		const nombreInput = document.getElementById('nombre');
		const fechaNacInput = document.getElementById('fechaNac');
		const edadInput = document.getElementById('edad');
		const tableBody = document.getElementById('personTableBody');
		const saveCsvButton = document.getElementById('saveCsvButton');
		const loadCsvButton = document.getElementById('loadCsvButton');
		const csvFileInput = document.getElementById('csvFileInput');

		form.addEventListener('submit', function (e) {
			e.preventDefault();
			const persona = {
				clave: claveInput.value,
				nombre: nombreInput.value,
				fechaNac: fechaNacInput.value,
				edad: edadInput.value
			};
			personas.push(persona);
			form.reset();
			actualizarTabla();
		});

		function actualizarTabla() {
			tableBody.innerHTML = '';
			personas.forEach(function (persona, index) {
				const row = document.createElement('tr');
				row.innerHTML = `
                <td>${persona.clave}</td>
                <td>${persona.nombre}</td>
                <td>${persona.fechaNac}</td>
                <td>${persona.edad}</td>
                <td><button onclick="eliminarPersona(${index})">Eliminar</button></td>
            `;
				tableBody.appendChild(row);
			});
		}

		function eliminarPersona(index) {
			personas.splice(index, 1);
			actualizarTabla();
		}

		saveCsvButton.addEventListener('click', function () {
			let csvContent = "Clave,Nombre,Fecha de Nacimiento,Edad\n";
			personas.forEach(persona => {
				csvContent += `${persona.clave},${persona.nombre},${persona.fechaNac},${persona.edad} \n`;
			});
			const blob = new Blob([csvContent], { type: 'text/csv' });
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			a.download = 'personas.csv';
			a.click();
			URL.revokeObjectURL(url);
		});

		loadCsvButton.addEventListener('click', function () {
			const file = csvFileInput.files[0];
			if (file) {
				const reader = new FileReader();
				reader.onload = function (e) {
					const rows = e.target.result.split("\n").filter(row => row.trim() !== "");
					personas = rows.slice(1).map(row => {
						const [clave, nombre, fechaNac, edad] = row.split(",");
						return { clave: clave.trim(), nombre: nombre.trim(), fechaNac: fechaNac.trim(), edad: parseInt(edad.trim()) };
					}).filter(persona => persona.clave);
					actualizarTabla();
				};
				reader.readAsText(file);
			} else {
				alert("Por favor selecciona un archivo CSV.");
			}
		});
	</script>
</body>

</html>
