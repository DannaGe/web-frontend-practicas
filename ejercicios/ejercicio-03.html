<HTML>
<HEAD>
<TITLE> Formulario 3 campos </TITLE> <!-- Título de la página -->
<SCRIPT LANGUAGE="JavaScript">
<!-- HIDE FROM OTHER BROWSERS --> 
//Oculta el código para navegadores que no soportan JavaScript 
        function cuadrado(form, num) // Función que calcula el cuadrado de un número
        {
            form.nCuadrado.value = num * num; // Multiplica el número por sí mismo y lo asigna al campo "nCuadrado"
        }

        function cubo(form, num) // Función que calcula el cubo de un número
        {
            form.nCubo.value = num * num * num; // Multiplica el número tres veces por sí mismo y lo asigna al campo "nCubo"
        }

        function proceso(form) // Función que solicita un número y calcula su cuadrado y cubo
        {
            form.nSemilla.blur(); // Quita el foco del campo "nSemilla"
            var num = prompt("Proporciona número semilla: ", "numero...."); // Solicita al usuario un número "semilla"
            form.nSemilla.value = num; // Asigna el número ingresado al campo "nSemilla"
            cuadrado(form, num); // Llama a la función cuadrado para calcular el cuadrado del número
            cubo(form, num); // Llama a la función cubo para calcular el cubo del número
        }

//STOP HIDING FROM OTHER BROWSERS --> <!-- Fin de la ocultación para navegadores antiguos -->
</SCRIPT>
</HEAD>
<BODY>
<FORM METHOD=POST> <!-- Inicio del formulario con el método POST -->
Número semilla:
<INPUT TYPE="text" NAME="nSemilla" VALUE="" onfocus="proceso(this.form);"> <!-- llama a la función proceso para solicitar y procesar el número semilla -->
<BR> 
Número al cuadrado:
<INPUT TYPE="text" NAME="nCuadrado" VALUE="" onfocus="this.blur();"> <!-- Campo que muestra el resultado del cuadrado, no permite edición -->
<BR> 
Número al cubo:
<INPUT TYPE="text" NAME="nCubo" VALUE="" onfocus="this.blur();"> <!-- Campo que muestra el resultado del cubo -->
</FORM>
</BODY>
</HTML>
